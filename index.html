<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="可自訂、可朗讀的雙語課堂短語工具"><title>雙語教師小幫手</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="page-shell"><header class="site-header"><div><p class="eyebrow">CLASSROOM LANGUAGE TOOL</p><h1>雙語教師小幫手</h1><p class="intro">點選句子顯示在課堂大字卡；按「朗讀」播放英文。自訂內容只儲存在這台裝置。</p></div><button id="theme-toggle" class="icon-button" type="button" aria-label="切換深色模式" title="切換深色模式">◐</button></header>
<section class="display-card" aria-live="polite" aria-label="目前選取的短語"><p id="display-en" class="display-en">請從下方選擇一句課堂短語</p><p id="display-zh" class="display-zh">Choose a phrase below.</p></section><nav id="categories" class="category-list" aria-label="短語分類"></nav><section id="phrase-panel" class="phrase-panel" aria-live="polite"></section>
<section class="settings-card" aria-labelledby="voice-heading"><h2 id="voice-heading">語音設定</h2><label for="voice-select">英文朗讀聲音</label><select id="voice-select"></select><p id="voice-message" class="help-text"></p></section>
<section class="settings-card" aria-labelledby="edit-heading"><div class="section-heading"><div><h2 id="edit-heading">自訂短語</h2><p class="help-text">變更會立即儲存在此瀏覽器；可先匯出備份。</p></div><button id="export-button" class="secondary-button" type="button">匯出備份</button></div><div class="form-grid"><label>分類<select id="edit-category"></select></label><label>英文短語<input id="en-input" type="text" maxlength="180" autocomplete="off"></label><label>中文翻譯<input id="zh-input" type="text" maxlength="180" autocomplete="off"></label></div><div class="actions"><button id="add-button" class="primary-button" type="button">新增短語</button><label class="import-label">匯入備份<input id="import-input" type="file" accept="application/json"></label><button id="restore-button" class="danger-button" type="button">還原預設短語</button></div><div id="edit-list" class="edit-list" aria-live="polite"></div></section></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
