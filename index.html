<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雙語教師小幫手</title><link rel="stylesheet" href="styles.css"></head><body><main class="page-shell"><header><div><p class="eyebrow">CLASSROOM LANGUAGE TOOL</p><h1>雙語教師小幫手</h1><p>點選圖卡找到教室指令；點選句子，讓學生同時看見大字與聽見英文。</p></div><button id="theme-toggle" aria-label="切換深色模式">◐</button></header><figure class="storyboard"><img src="assets/classroom-scenes-v1.png" alt="八種水彩繪本風國小教室情境"><figcaption>選擇一種教室情境，找到能立刻使用的英文。</figcaption></figure><section class="display-card" aria-live="polite"><p id="display-en">請從下方選擇一句課堂短語</p><p id="display-zh">Choose a phrase below.</p></section><nav id="categories" aria-label="短語分類"></nav><section id="phrase-panel" aria-live="polite"></section><section class="settings-card"><h2>語音設定</h2><label>英文朗讀聲音<select id="voice-select"></select></label><p id="voice-message"></p></section><section class="settings-card"><h2>自訂短語</h2><p>變更會儲存在此瀏覽器。</p><label>分類<select id="edit-category"></select></label><label>英文短語<input id="en-input" maxlength="180"></label><label>中文翻譯<input id="zh-input" maxlength="180"></label><div class="actions"><button id="add-button">新增短語</button><button id="export-button">匯出備份</button><label class="import">匯入備份<input id="import-input" type="file" accept="application/json"></label><button id="restore-button">還原預設短語</button></div><div id="edit-list"></div></section><footer>製作者：桃園市大忠國小 陳佳慧老師團隊</footer></main><div id="toast" role="status"></div><section id="command-stage" role="dialog" aria-modal="true" aria-labelledby="stage-en" hidden><button id="stage-close">縮小顯示 ×</button><div><p>CLASSROOM COMMAND</p><p id="stage-en"></p><p id="stage-zh"></p><p>按 Esc 或「縮小顯示」回到短語工具</p></div></section><script src="app.js"></script></body></html>
